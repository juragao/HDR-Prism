; HDR Prism 配置（与 hdrprism.exe 同目录）

[Paths]
; 封装输出目录；留空 = 与源文件同目录。例：OutputDir=X:\
OutputDir=

[Defaults]
; 封装参数兜底：仅在没有同名 .json 且 -a 内无 hdrgm XMP 时生效。
; 注意：这些值必须与 gainmap 的实际生成参数一致，否则 HDR 亮度会渲染错误。
GainMapMin=0
GainMapMax=3.0
Gamma=1.0
OffsetSDR=0.015625
OffsetHDR=0.015625
HDRCapacityMin=0
; 留空 = 取 GainMapMax
HDRCapacityMax=
BaseRenditionIsHDR=0
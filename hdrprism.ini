; HDR Prism 配置（放置于主程序同目录）

[Paths]
; 提取输出目录，留空=源目录\SDR output
SdrOutputDir=
; 封装输出目录，留空=源目录\HDR output
HdrOutputDir=

[Defaults]
; 封装参数兜底：在没有同名 .json 且 -a 内无 hdrgm XMP 时使用以下参数。
; 注意：这些值必须与 gainmap 的实际生成参数一致，否则 HDR 亮度会渲染错误。
GainMapMin=0
GainMapMax=3.0
Gamma=1.0
OffsetSDR=0.015625
OffsetHDR=0.015625
HDRCapacityMin=0
; HDRCapacityMax留空 = 取 GainMapMax
HDRCapacityMax=
BaseRenditionIsHDR=0